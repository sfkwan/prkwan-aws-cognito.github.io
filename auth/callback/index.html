<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .login-button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none; /* 移除超連結底線 */
            margin-top: 20px;
            display: inline-block;
        }
        .login-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Preston website - Day9</h1>
        <p>Your tracking code is: <strong id="tracking-code">None</strong></p>
        <a href="https://prkwan-userpool.auth.us-east-1.amazoncognito.com/login?client_id=2ubrhcdgo498etmuc71buhv138&redirect_uri=https%3A%2F%2Fsfkwan.github.io%2Fprkwan-aws-cognito.github.io%2Fauth%2Fcallback%2F&response_type=code&scope=email+openid+phone" class="login-button">
            Login
        </a>
    </div>
    
    <script>
        // 2. Get the full query string from the current page URL (e.g., "?name=Alex&code=123")
        const queryString = window.location.search;
        
        // 3. Parse the query string using URLSearchParams
        const urlParams = new URLSearchParams(queryString);
        
        // 4. Extract specific parameter values by their keys
        const nameParam = urlParams.get('name'); // Looks for 'name'
        const codeParam = urlParams.get('code'); // Looks for 'code'
        
        // 5. Output the values directly into the HTML elements safely
        if (nameParam) {
            document.getElementById('username').textContent = nameParam;
        }
        
        if (codeParam) {
            document.getElementById('tracking-code').textContent = codeParam;
        }
    </script>
</body>
</html>
